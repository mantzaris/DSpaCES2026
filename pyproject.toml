[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-fusion"
version = "0.1.0"
description = "Bounded study of weighted provenance and conservative scalar forecast fusion"
requires-python = ">=3.8"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=1.5", "scikit-learn>=1.2", "matplotlib>=3.6", "PyYAML>=6", "threadpoolctl>=3", "tzdata>=2024.1"]

[project.optional-dependencies]
test = ["pytest>=7"]
gpu = ["torch>=2.8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
